name: Gerar APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**', 'player.html', 'config.js', 'logo.png', '.github/workflows/apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Copiar o player para dentro do app
        run: |
          mkdir -p android/app/src/main/assets
          cp player.html config.js logo.png android/app/src/main/assets/
      - name: Compilar
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Publicar o APK em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk tvindoor.apk
          gh release delete apk-latest --cleanup-tag -y || true
          gh release create apk-latest tvindoor.apk --title "TV Indoor - APK mais recente" --notes "APK gerado automaticamente."
